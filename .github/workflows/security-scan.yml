name: Security Scan

# 依赖漏洞定期扫描：Python（pip-audit，读 uv.lock 导出）+ 前端（npm audit，生产依赖）。
# 只在每周定时 + 手动触发，不在 PR 上跑 —— 代码级安全由 CodeQL 覆盖；
# 传递依赖的历史漏洞不应阻塞功能 PR，本工作流红即告警，由维护者评估升级。
on:
  schedule:
    # 每周一 04:00 北京时间（周日 20:00 UTC）
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Export locked dependencies
        # --no-hashes：pip 无法对 VCS（git）依赖做哈希校验，带 hash 会直接失败
        # --no-emit-package：yyc3-harness/memory/gateway 为 YYC3-Agent-Core
        #   私有 monorepo 的一方包（git 依赖），审计无意义且 runner 无法拉取；
        #   其 PyPI 传递依赖不受影响，仍在审计范围内
        run: uv export --format requirements-txt --no-dev --no-emit-project --no-hashes --no-emit-package yyc3-harness --no-emit-package yyc3-memory --no-emit-package yyc3-gateway --output-file requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit -r requirements-audit.txt

  frontend:
    name: npm audit (dashboard deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
