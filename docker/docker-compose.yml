# =============================================================================
# YYC3-Pai — Docker Compose
#
# 用法（在仓库根目录执行）:
#   docker compose -f docker/docker-compose.yml up -d
#   YYC3_PORT=9090 docker compose -f docker/docker-compose.yml up -d
#   YYC3_DEFAULT_PASSWORD=<your-strong-password> docker compose -f docker/docker-compose.yml up -d
#
# 可在 docker/ 目录放置 .env 文件，例如:
#   YYC3_PORT=9090
#   YYC3_DEFAULT_PASSWORD=<your-strong-password>
#   YYC3_ADMIN_USERNAME=admin
#   YYC3_DATABASE_DRIVER=postgresql
#   YYC3_DATABASE_URL=postgresql://yyc3:yyc3@host.docker.internal:5432/yyc3_pai
#
# 注意: docker/.env 仅用于 Compose 插值；变量必须列在下方 environment
# 才会进入容器。也可写入数据卷内的 ~/.yyc3-pai/env（宿主机挂载目录下的 env）。
# 密码须 ≥8 位且同时包含字母与数字（与控制台改密策略一致）。
# 未设置 YYC3_DEFAULT_PASSWORD 时，入口脚本会随机生成密码并写入 credential.txt。
#
# 旧变量 OCTOP_* 仍作为兜底兼容。
# =============================================================================

services:
  collab:
    # YYC³ CRDT 协作服务：为前端 pai.yyc3.vip 提供房间令牌鉴权的 y-websocket
    # 鉴权：COLLAB_TOKENS（静态白名单，逗号分隔）或 COLLAB_SECRET（HMAC 房间令牌）
    image: node:20-alpine
    container_name: yyc3-collab
    restart: unless-stopped
    working_dir: /srv
    command: sh -c "npm ci --omit=dev --no-fund --no-audit && node server.js"
    volumes:
      - ../services/collab:/srv
    ports:
      - "${YYC3_COLLAB_PORT:-8090}:8080"
    environment:
      - PORT=8080
      - COLLAB_TOKENS=${YYC3_COLLAB_TOKENS:-}
      - COLLAB_SECRET=${YYC3_COLLAB_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  pai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: yyc3-pai:latest
    container_name: yyc3-pai
    restart: unless-stopped
    ports:
      - "${YYC3_PORT:-${OCTOP_PORT:-8088}}:${YYC3_PORT:-${OCTOP_PORT:-8088}}"
    volumes:
      - ${YYC3_DATA:-${OCTOP_DATA:-~/.yyc3-pai}}:/data/.yyc3-pai
    # 显式声明（与镜像内 HEALTHCHECK 等价），便于 compose ps / 上层编排可见
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:$${YYC3_PORT:-$${OCTOP_PORT:-8088}}/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      - HOME=/data
      - YYC3_BIND_HOST=0.0.0.0
      - YYC3_PORT=${YYC3_PORT:-${OCTOP_PORT:-8088}}
      - YYC3_LOG_LEVEL=${YYC3_LOG_LEVEL:-${OCTOP_LOG_LEVEL:-info}}
      - YYC3_DEFAULT_PASSWORD=${YYC3_DEFAULT_PASSWORD:-${OCTOP_DEFAULT_PASSWORD:-}}
      - YYC3_ADMIN_USERNAME=${YYC3_ADMIN_USERNAME:-${OCTOP_ADMIN_USERNAME:-admin}}
      - YYC3_ADMIN_DISPLAY_NAME=${YYC3_ADMIN_DISPLAY_NAME:-${OCTOP_ADMIN_DISPLAY_NAME:-Admin}}
      - YYC3_DATABASE_URL=${YYC3_DATABASE_URL:-${OCTOP_DATABASE_URL:-}}
      - YYC3_DATABASE_DRIVER=${YYC3_DATABASE_DRIVER:-${OCTOP_DATABASE_DRIVER:-}}
      - YYC3_DATABASE_SQLITE_PATH=${YYC3_DATABASE_SQLITE_PATH:-${OCTOP_DATABASE_SQLITE_PATH:-}}
      - YYC3_DATABASE_HOST=${YYC3_DATABASE_HOST:-${OCTOP_DATABASE_HOST:-}}
      - YYC3_DATABASE_PORT=${YYC3_DATABASE_PORT:-${OCTOP_DATABASE_PORT:-}}
      - YYC3_DATABASE_NAME=${YYC3_DATABASE_NAME:-${OCTOP_DATABASE_NAME:-}}
      - YYC3_DATABASE_USER=${YYC3_DATABASE_USER:-${OCTOP_DATABASE_USER:-}}
      - YYC3_DATABASE_PASSWORD=${YYC3_DATABASE_PASSWORD:-${OCTOP_DATABASE_PASSWORD:-}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
